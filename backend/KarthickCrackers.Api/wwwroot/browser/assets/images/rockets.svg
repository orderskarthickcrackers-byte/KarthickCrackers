<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="rocketGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="40%" stop-color="#F5C242"/>
      <stop offset="100%" stop-color="#14120E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#14120E"/>
  <circle cx="260" cy="60" r="70" fill="url(#rocketGlow)"/>

  <!-- Rocket 1 (Center Flying) -->
  <g transform="translate(190, 40) rotate(-25)">
    <polygon points="20,0 40,40 0,40" fill="#E5A93C"/>
    <rect x="5" y="40" width="30" height="90" fill="#191611" stroke="#F5C242" stroke-width="2"/>
    <line x1="20" y1="130" x2="20" y2="220" stroke="#BDB5A4" stroke-width="3"/>
    <!-- Exhaust plume -->
    <polygon points="10,130 30,130 20,170" fill="#F5C242"/>
  </g>

  <!-- Rocket 2 (Side Left) -->
  <g transform="translate(90, 80) rotate(-35)">
    <polygon points="15,0 30,30 0,30" fill="#F5C242"/>
    <rect x="4" y="30" width="22" height="70" fill="#191611" stroke="#E5A93C" stroke-width="2"/>
    <line x1="15" y1="100" x2="15" y2="180" stroke="#BDB5A4" stroke-width="2.5"/>
  </g>

  <!-- Rocket 3 (Side Right) -->
  <g transform="translate(280, 70) rotate(-15)">
    <polygon points="15,0 30,30 0,30" fill="#E5A93C"/>
    <rect x="4" y="30" width="22" height="70" fill="#191611" stroke="#F5C242" stroke-width="2"/>
    <line x1="15" y1="100" x2="15" y2="180" stroke="#BDB5A4" stroke-width="2.5"/>
  </g>

  <text x="200" y="275" font-family="sans-serif" font-weight="900" font-size="18" fill="#F5C242" text-anchor="middle">SKY ROCKET WHISTLERS</text>
</svg>
