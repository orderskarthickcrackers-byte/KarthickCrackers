<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C242"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#805608"/>
    </linearGradient>
    <radialGradient id="fountainGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5C242"/>
      <stop offset="80%" stop-color="#E5A93C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14120E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#14120E"/>
  <ellipse cx="200" cy="80" rx="140" ry="70" fill="url(#fountainGlow)"/>

  <!-- Erupting Fountain Sparks -->
  <path d="M 200 170 Q 150 70 80 30 M 200 170 Q 170 50 140 10 M 200 170 Q 200 40 200 5 M 200 170 Q 230 50 260 10 M 200 170 Q 250 70 320 30 M 200 170 Q 180 80 110 50 M 200 170 Q 220 80 290 50" stroke="#F5C242" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="12 6"/>

  <path d="M 200 170 Q 160 90 100 45 M 200 170 Q 200 60 200 20 M 200 170 Q 240 90 300 45" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Clay Flowerpot Cone -->
  <polygon points="150,270 250,270 225,170 175,170" fill="url(#potGrad)" stroke="#F5C242" stroke-width="3"/>
  <ellipse cx="200" cy="170" rx="25" ry="6" fill="#201B15" stroke="#F5C242" stroke-width="2"/>

  <text x="200" y="240" font-family="sans-serif" font-weight="900" font-size="15" fill="#0E0C0A" text-anchor="middle">FLOWER POT</text>
  <text x="200" y="258" font-family="sans-serif" font-weight="800" font-size="11" fill="#14120E" text-anchor="middle">DELUXE FOUNTAIN</text>
</svg>
