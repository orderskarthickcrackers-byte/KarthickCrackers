<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="kidGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="50%" stop-color="#F5C242" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14120E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#14120E"/>
  <circle cx="200" cy="130" r="100" fill="url(#kidGlow)"/>

  <!-- Cartoon Novelty Gift Box -->
  <rect x="110" y="100" width="180" height="150" rx="12" fill="#E5A93C" stroke="#F5C242" stroke-width="4"/>
  <rect x="120" y="110" width="160" height="130" rx="8" fill="#191611" stroke="#9E7011" stroke-width="2"/>

  <!-- Colorful Toys inside Box -->
  <circle cx="160" cy="160" r="22" fill="#F5C242"/>
  <text x="160" y="165" font-family="sans-serif" font-weight="800" font-size="14" fill="#0E0C0A" text-anchor="middle">FUN</text>

  <polygon points="200,130 220,170 180,170" fill="#E5A93C"/>
  <circle cx="240" cy="160" r="22" fill="#F5C242"/>
  <text x="240" y="165" font-family="sans-serif" font-weight="800" font-size="14" fill="#0E0C0A" text-anchor="middle">SAFE</text>

  <!-- Ribbon -->
  <rect x="190" y="100" width="20" height="150" fill="#E5A93C"/>
  <path d="M 170 95 Q 200 65 200 100 Q 200 65 230 95 Z" fill="#F5C242"/>

  <text x="200" y="215" font-family="sans-serif" font-weight="900" font-size="16" fill="#F5C242" text-anchor="middle">KIDS NOVELTY PACK</text>
  <text x="200" y="232" font-family="sans-serif" font-weight="700" font-size="11" fill="#BDB5A4" text-anchor="middle">LOW NOISE &amp; SMOKE</text>
</svg>
