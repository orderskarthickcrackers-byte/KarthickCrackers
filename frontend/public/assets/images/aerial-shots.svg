<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="aerialBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2808"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#F5C242"/>
    </linearGradient>
    <radialGradient id="skyBurst" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F5C242"/>
      <stop offset="70%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#14120E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#14120E"/>

  <!-- High Sky Bursts -->
  <circle cx="200" cy="80" r="75" fill="url(#skyBurst)"/>
  <circle cx="80" cy="70" r="45" fill="url(#skyBurst)" opacity="0.6"/>
  <circle cx="320" cy="70" r="45" fill="url(#skyBurst)" opacity="0.6"/>

  <path d="M 200 80 L 200 15 M 200 80 L 260 30 M 200 80 L 270 80 M 200 80 L 250 130 M 200 80 L 200 145 M 200 80 L 150 130 M 200 80 L 130 80 M 200 80 L 140 30" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 10-Shot Cake Multi-Tube Box -->
  <rect x="130" y="140" width="140" height="130" rx="8" fill="url(#aerialBox)" stroke="#F5C242" stroke-width="3"/>
  <rect x="140" y="150" width="120" height="110" rx="4" fill="#191611"/>

  <!-- 10 Launch Tubes Top Grid -->
  <circle cx="160" cy="170" r="12" fill="#E5A93C" stroke="#F5C242" stroke-width="2"/>
  <circle cx="190" cy="170" r="12" fill="#E5A93C" stroke="#F5C242" stroke-width="2"/>
  <circle cx="220" cy="170" r="12" fill="#E5A93C" stroke="#F5C242" stroke-width="2"/>
  <circle cx="160" cy="200" r="12" fill="#E5A93C" stroke="#F5C242" stroke-width="2"/>
  <circle cx="190" cy="200" r="12" fill="#E5A93C" stroke="#F5C242" stroke-width="2"/>
  <circle cx="220" cy="200" r="12" fill="#E5A93C" stroke="#F5C242" stroke-width="2"/>

  <text x="200" y="242" font-family="sans-serif" font-weight="900" font-size="14" fill="#F5C242" text-anchor="middle">THUNDER KING</text>
  <text x="200" y="256" font-family="sans-serif" font-weight="700" font-size="10" fill="#BDB5A4" text-anchor="middle">10 SHOTS AERIAL CAKE</text>
</svg>
