<div class="admin-login-container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: #F8FAFC;">
  <div class="login-card" style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: var(--radius-m); padding: 36px 32px; box-shadow: 0 10px 30px rgba(15,23,42,0.08);">
    
    <div class="brand-header" style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: #FFFBEB; border: 1px solid #FCD34D; margin-bottom: 12px; box-shadow: 0 0 16px rgba(245,158,11,0.2); overflow: hidden;">
        <img src="assets/images/karthick-crackers-logo.jpg" alt="Karthick Crackers Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
      </div>
      <h2 style="font-size: 26px; color: #0F172A; margin-bottom: 4px; font-weight: 800;">Admin Portal</h2>
      <p style="font-size: 13px; color: #64748B;">Karthick Crackers Administration</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      @if (errorMessage) {
        <div class="alert-error" style="background: #FEF2F2; border: 1px solid #FCA5A5; color: #991B1B; padding: 10px 14px; border-radius: var(--radius-s); font-size: 13px; margin-bottom: 20px; text-align: center;">
          {{ errorMessage }}
        </div>
      }

      <div class="form-group" style="margin-bottom: 20px;">
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;">Email Address</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="karthickkumar2014000@gmail.com"
          style="width: 100%; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: var(--radius-s); padding: 12px 16px; color: #0F172A; font-size: 14px; outline: none; transition: border-color 0.2s;"
        />
      </div>

      <div class="form-group" style="margin-bottom: 28px;">
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;">Password</label>
        <input 
          type="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="••••••••"
          style="width: 100%; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: var(--radius-s); padding: 12px 16px; color: #0F172A; font-size: 14px; outline: none; transition: border-color 0.2s;"
        />
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-block" 
        [disabled]="isLoading || !email || !password"
        style="width: 100%; padding: 12px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer;">
        @if (isLoading) {
          <span>Logging in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>
  </div>
</div>
