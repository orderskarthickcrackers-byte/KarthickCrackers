<div class="product-card" (click)="navigateToDetail()">
  <div class="pc-media">
    @if (discountBadgeText) {
      <span class="pc-badge">{{ discountBadgeText }}</span>
    }
    @if (isGiftBox) {
      <div class="pc-giftbox-icon-wrap" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 140px; background: radial-gradient(circle, var(--mustard-wash-2) 0%, rgba(245, 194, 66, 0.05) 70%);">
        <span class="giftbox-emoji" style="font-size: 52px; filter: drop-shadow(0 4px 10px rgba(245, 194, 66, 0.4));">{{ giftBoxEmoji }}</span>
      </div>
    } @else {
      <img [src]="product.image" [alt]="product.name" class="product-img" (error)="onImgError($event)">
    }
    <div class="pc-qty-pill" (click)="$event.stopPropagation()">
      <button type="button" class="pc-qty-btn" (click)="onDecrement($event)" [disabled]="currentQty === 0" [style.opacity]="currentQty === 0 ? '0.35' : '1'" [style.cursor]="currentQty === 0 ? 'default' : 'pointer'">−</button>
      <span class="pc-qty-num">{{ currentQty }}</span>
      <button type="button" class="pc-qty-btn" (click)="onIncrement($event)" [attr.aria-label]="'Add ' + product.name + ' to cart'">+</button>
    </div>
  </div>
  <div class="pc-body">
    <span class="pc-code">{{ product.code }}</span>
    <span class="pc-name">{{ product.name }}</span>
    <div class="pc-foot">
      <div class="pc-price-wrap">
        <span class="pc-price">{{ formattedPrice }}</span>
        @if (hasDiscount) {
          <span class="pc-mrp-strikethrough">{{ formattedMrp }}</span>
        }
      </div>
      <span class="pc-unit">{{ product.unit }}</span>
    </div>
  </div>
</div>
