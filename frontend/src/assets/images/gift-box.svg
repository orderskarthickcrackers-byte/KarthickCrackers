<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="giftBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="50%" stop-color="#F5C242"/>
      <stop offset="100%" stop-color="#9E7011"/>
    </linearGradient>
    <radialGradient id="giftGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="40%" stop-color="#F5C242"/>
      <stop offset="100%" stop-color="#14120E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#14120E"/>
  <circle cx="200" cy="140" r="110" fill="url(#giftGlow)"/>

  <!-- Large Family Hamper Box -->
  <rect x="90" y="90" width="220" height="160" rx="10" fill="url(#giftBoxGrad)" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="100" y="100" width="200" height="140" rx="6" fill="#191611" stroke="#F5C242" stroke-width="2"/>

  <!-- Golden Ribbons & Bow -->
  <rect x="190" y="90" width="20" height="160" fill="#F5C242"/>
  <rect x="90" y="160" width="220" height="20" fill="#F5C242"/>

  <path d="M 160 85 Q 200 45 200 90 Q 200 45 240 85 Z" fill="#FFFFFF"/>
  <circle cx="200" cy="90" r="10" fill="#E5A93C"/>

  <text x="200" y="135" font-family="sans-serif" font-weight="900" font-size="17" fill="#F5C242" text-anchor="middle">DIWALI FAMILY HAMPER</text>
  <text x="200" y="152" font-family="sans-serif" font-weight="700" font-size="11" fill="#FFF" text-anchor="middle">24 ASSORTED PREMIUM CRACKERS</text>

  <rect x="120" y="195" width="160" height="30" rx="15" fill="#E5A93C"/>
  <text x="200" y="215" font-family="sans-serif" font-weight="900" font-size="13" fill="#0E0C0A" text-anchor="middle">BEST VALUE COMBO</text>
</svg>
