<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="spinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="40%" stop-color="#F5C242"/>
      <stop offset="70%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#14120E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#14120E"/>
  <circle cx="200" cy="150" r="120" fill="url(#spinGlow)" opacity="0.8"/>

  <!-- Chakkar Wheel Body -->
  <circle cx="200" cy="150" r="65" fill="#E5A93C" stroke="#F5C242" stroke-width="4"/>
  <circle cx="200" cy="150" r="45" fill="#191611" stroke="#9E7011" stroke-width="3"/>
  <circle cx="200" cy="150" r="18" fill="#F5C242"/>

  <!-- Spinning Spiral Rays -->
  <path d="M 200 85 A 65 65 0 0 1 265 150 M 265 150 A 65 65 0 0 1 200 215 M 200 215 A 65 65 0 0 1 135 150 M 135 150 A 65 65 0 0 1 200 85" fill="none" stroke="#F5C242" stroke-width="5" stroke-dasharray="15 10"/>

  <!-- Outer Ring Sparks -->
  <path d="M 200 150 L 320 100 M 200 150 L 330 180 M 200 150 L 270 260 M 200 150 L 130 260 M 200 150 L 70 180 M 200 150 L 80 90 M 200 150 L 140 40 M 200 150 L 270 40" stroke="#E5A93C" stroke-width="2" stroke-dasharray="8 6"/>

  <text x="200" y="275" font-family="sans-serif" font-weight="900" font-size="18" fill="#F5C242" text-anchor="middle">GROUND CHAKKAR DELUXE</text>
</svg>
