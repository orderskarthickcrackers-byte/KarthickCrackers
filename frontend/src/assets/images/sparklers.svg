<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#F5C242" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#E5A93C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#191611" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2317"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#9E7011"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#14120E"/>
  <circle cx="200" cy="120" r="110" fill="url(#sparkGlow)"/>

  <!-- Sparkler Box Package -->
  <rect x="130" y="80" width="140" height="180" rx="8" fill="url(#boxGrad)" stroke="#F5C242" stroke-width="2"/>
  <rect x="140" y="90" width="120" height="160" rx="4" fill="#191611" stroke="#9E7011" stroke-width="1"/>
  
  <text x="200" y="125" font-family="sans-serif" font-weight="900" font-size="16" fill="#F5C242" text-anchor="middle">PREMIUM</text>
  <text x="200" y="150" font-family="sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">SPARKLERS</text>
  <text x="200" y="170" font-family="sans-serif" font-weight="600" font-size="12" fill="#BDB5A4" text-anchor="middle">SIVAKASI SPECIAL</text>
  <rect x="150" y="190" width="100" height="24" rx="12" fill="#E5A93C"/>
  <text x="200" y="206" font-family="sans-serif" font-weight="800" font-size="11" fill="#0E0C0A" text-anchor="middle">10 Pcs Pack</text>

  <!-- Sparklers sticking out -->
  <line x1="160" y1="90" x2="140" y2="20" stroke="#C0C0C0" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="90" x2="200" y2="10" stroke="#C0C0C0" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="90" x2="260" y2="20" stroke="#C0C0C0" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing Sparks -->
  <circle cx="140" cy="20" r="14" fill="url(#sparkGlow)"/>
  <circle cx="200" cy="10" r="18" fill="url(#sparkGlow)"/>
  <circle cx="260" cy="20" r="14" fill="url(#sparkGlow)"/>

  <path d="M 200 10 L 190 0 M 200 10 L 210 0 M 200 10 L 200 -5 M 200 10 L 215 10 M 200 10 L 185 10" stroke="#FFF" stroke-width="2"/>
</svg>
